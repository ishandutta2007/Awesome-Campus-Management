<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Card/Pill Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 52px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    .stat-val { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #38bdf8; }
    .stat-lbl { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
    
    /* Subtle SVG CSS Animations for Dynamic Background Elements */
    @keyframes pulse {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.08) translate(-10px, 15px); opacity: 0.7; }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-1 { animation: pulse 8s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: pulse 10s ease-in-out infinite reverse; transform-origin: center; }
    .floating-card { animation: floatWave 6s ease-in-out infinite; }
    .flowing-line { stroke-dasharray: 20 10; animation: dashStream 35s linear infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#accentGrad1)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept in lower z-index background) -->
  <g class="orb-1" filter="url(#glow)">
    <circle cx="150" cy="90" r="140" fill="#6366f1" opacity="0.25"/>
  </g>
  <g class="orb-2" filter="url(#glow)">
    <circle cx="1050" cy="270" r="160" fill="#06b6d4" opacity="0.2"/>
  </g>

  <!-- Dynamic Animated Graphic Wave Lines (Background) -->
  <path class="flowing-line" d="M -50 280 Q 300 340 600 240 T 1250 180" fill="none" stroke="url(#accentGrad1)" stroke-width="3" opacity="0.3"/>
  <path class="flowing-line" d="M -50 220 Q 350 120 700 260 T 1250 220" fill="none" stroke="url(#accentGrad2)" stroke-width="2" opacity="0.35"/>

  <!-- Decorative Network Nodes / Graph Lines (Background Side Art) -->
  <g opacity="0.25" stroke="#94a3b8" stroke-width="1">
    <line x1="880" y1="70" x2="960" y2="120"/>
    <line x1="960" y1="120" x2="1080" y2="80"/>
    <line x1="960" y1="120" x2="1020" y2="190"/>
    <circle cx="880" cy="70" r="4" fill="#6366f1"/>
    <circle cx="960" cy="120" r="6" fill="#38bdf8"/>
    <circle cx="1080" cy="80" r="5" fill="#a855f7"/>
    <circle cx="1020" cy="190" r="4" fill="#34d399"/>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed High Contrast & Unobscured Title/Subtitle -->

  <!-- Top Pill Badge -->
  <g transform="translate(80, 50)">
    <rect width="240" height="32" rx="16" fill="url(#cardGrad)" stroke="url(#accentGrad1)" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#10b981"/>
    <text x="32" y="21" class="badge-text">🎓 TOP CAMPUS ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="140" class="title">Awesome Campus Management</text>

  <!-- Subtitle -->
  <text x="80" y="185" class="subtitle">Curated Higher Education ERPs, Student Information Systems (SIS) &amp; Open-Source Platforms</text>

  <!-- Bottom Interactive Stats / Highlights Bar -->
  <g transform="translate(80, 230)">
    <!-- Stat 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="20" y="34" class="stat-val">$20B+ 📈</text>
      <text x="20" y="54" class="stat-lbl">Global Market Size</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(200, 0)">
      <rect width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="20" y="34" class="stat-val">10+ SaaS 🏢</text>
      <text x="20" y="54" class="stat-lbl">Enterprise Platforms</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(400, 0)">
      <rect width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="20" y="34" class="stat-val">12+ Open-Source 🔓</text>
      <text x="20" y="54" class="stat-lbl">Self-Hosted Tools</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(600, 0)">
      <rect width="220" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="20" y="34" class="stat-val">Verified Pricing 💰</text>
      <text x="20" y="54" class="stat-lbl">Transparent Comparison</text>
    </g>
  </g>
</svg>
